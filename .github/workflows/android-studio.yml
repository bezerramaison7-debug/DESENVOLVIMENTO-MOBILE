name: Capturar Android Studio
on:
  push:
    paths:
      - '.github/workflows/android-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar a compilação Android
        run: gradle -p android --console=plain assembleDebug
      - name: Instalar ambiente gráfico temporário
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth xdotool imagemagick tesseract-ocr
          curl -fLsS --retry 3 'https://redirector.gvt1.com/edgedl/android/studio/ide-zips/2024.3.1.13/android-studio-2024.3.1.13-linux.tar.gz' |
            tar -xz -C "$RUNNER_TEMP"
      - name: Abrir o projeto e registrar o Android Studio
        shell: bash
        run: |
          mkdir -p capturas-ide "$RUNNER_TEMP/studio-config/options"
          cat > "$RUNNER_TEMP/studio-config/options/usage.statistics.xml" <<'XML'
          <application><component name="UsageStatisticsPersistenceComponent"><option name="allowed" value="false" /></component></application>
          XML
          cat > "$RUNNER_TEMP/studio.properties" <<PROPERTIES
          idea.config.path=$RUNNER_TEMP/studio-config
          idea.system.path=$RUNNER_TEMP/studio-cache
          idea.log.path=$RUNNER_TEMP/studio-log
          idea.initially.ask.config=false
          disable.android.first.run=true
          PROPERTIES
          export STUDIO_PROPERTIES="$RUNNER_TEMP/studio.properties"
          export STUDIO_BIN="$RUNNER_TEMP/android-studio/bin/studio.sh"
          export GRADLE_HOME
          GRADLE_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          cat > android/.idea-gradle-settings <<'XML'
          <project version="4">
            <component name="GradleSettings">
              <option name="linkedExternalProjectsSettings">
                <GradleProjectSettings>
                  <option name="distributionType" value="LOCAL" />
                  <option name="gradleHome" value="GRADLE_DIR" />
                  <option name="externalProjectPath" value="$PROJECT_DIR$" />
                  <option name="gradleJvm" value="#JAVA_HOME" />
                </GradleProjectSettings>
              </option>
            </component>
          </project>
          XML
          mkdir -p android/.idea
          sed "s|GRADLE_DIR|$GRADLE_HOME|g" android/.idea-gradle-settings > android/.idea/gradle.xml
          xvfb-run -a -s '-screen 0 1440x900x24' bash -euc '
            "$STUDIO_BIN" "$GITHUB_WORKSPACE/android" "$GITHUB_WORKSPACE/android/app/src/main/java/br/edu/labmobile/MainActivity.java" > capturas-ide/abertura.log 2>&1 &
            studio_pid=$!
            trap "kill $studio_pid 2>/dev/null || true" EXIT
            for n in $(seq 1 14); do
              sleep 5
              import -window root capturas-ide/estado.png
              screen=$(tesseract capturas-ide/estado.png stdout 2>/dev/null)
              if grep -qi "Help improve Android Studio" <<< "$screen"; then
                xdotool mousemove 680 581 click 1
                sleep 2
              fi
              if grep -qi "Trust Project" <<< "$screen"; then
                tesseract capturas-ide/estado.png stdout tsv 2>/dev/null |
                  awk -F "\t" '"'"'$12 == "Trust" {x=$7+$9/2;y=$8+$10/2;s=$5} $5==s && $12=="Project" && x {print int(x),int(y);x=0}'"'"' | tail -1 |
                  while read -r x y; do xdotool mousemove "$x" "$y" click 1; done
              fi
              if window=$(xdotool search --onlyvisible --name "Trust (and Open|Project)" 2>/dev/null | tail -1) && [ -n "$window" ]; then
                xdotool windowfocus --sync "$window" key Return || true
              fi
              if window=$(xdotool search --onlyvisible --name "LaboratorioMobile|MainActivity.java" 2>/dev/null | tail -1) && [ -n "$window" ]; then
                xdotool windowsize "$window" 1420 860 windowmove "$window" 6 8 || true
              fi
              import -window root "capturas-ide/ide-$n.png"
              xdotool search --onlyvisible --name "." getwindowname %@ >> capturas-ide/janelas.txt || true
            done
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-android-studio
          path: capturas-ide/
