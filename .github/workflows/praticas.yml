name: Validar práticas mobile
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK
        run: gradle -p android --console=plain assembleDebug
      - name: Habilitar KVM do runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar os roteiros Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            set -o pipefail
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            python3 -u tests/android_ui.py evidencias/execucao-android | tee evidencias/execucao-android.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execucao-android
          path: |
            evidencias/execucao-android*
            android/app/build/outputs/apk/debug/app-debug.apk
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build web -t lib/roteiro3_login.dart --output build/roteiro3
      - run: flutter build web -t lib/roteiro8_senha.dart --output build/roteiro8
